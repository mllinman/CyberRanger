[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = ["cd client && npm ci --include=dev --prefer-offline --no-audit && cd ../server && npm ci --include=dev --prefer-offline --no-audit"]

[phases.build]
cmds = ["cd client && npm run build && echo '=== CLIENT BUILD COMPLETE ===' && test -d .next && echo '✓ Client .next exists' || (echo '✗ Client .next missing!' && exit 1) && cd ../server && npm run build && echo '=== SERVER BUILD COMPLETE ===' && ls -la dist && cp -r ../client/.next ./dist/ && echo '=== .NEXT COPY COMPLETE ===' && test -d ./dist/.next && echo '✓ .next copied to dist' || (echo '✗ .next copy failed!' && exit 1) && (test -d ../client/public && cp -r ../client/public ./dist/ || true) && echo '=== FINAL dist CONTENTS ===' && ls -la ./dist && ls -la ./dist/.next | head -20"]

[start]
cmd = "cd server && npm start"

[variables]
NODE_ENV = "production"
