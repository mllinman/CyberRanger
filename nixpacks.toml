[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = ["cd client && npm ci --prefer-offline --no-audit && cd ../server && npm ci --prefer-offline --no-audit"]

[phases.build]
cmds = ["cd client && npm run build && cd ../server && npm run build && mkdir -p dist && cp -r ../client/.next dist/ && (test -d ../client/public && cp -r ../client/public dist/ || true) && echo '--- DEBUG: Contents of server/dist ---' && ls -la dist/ && echo '--- DEBUG: Contents of server/dist/.next ---' && ls -la dist/.next"]

[start]
cmd = "cd server && npm start"

[variables]
NODE_ENV = "production"
